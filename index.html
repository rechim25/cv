<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Radu Echim CV</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f3efe8;
      --panel: #fffdf9;
      --text: #1f1a17;
      --muted: #6a625d;
      --accent: #8c3b2a;
      --accent-strong: #6e2517;
      --border: #d8cdc2;
      --shadow: 0 24px 60px rgba(31, 26, 23, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--text);
      background:
        radial-gradient(circle at top, rgba(140, 59, 42, 0.10), transparent 32%),
        linear-gradient(180deg, #f7f2eb 0%, var(--bg) 100%);
    }

    main {
      width: min(1100px, calc(100% - 32px));
      margin: 0 auto;
      padding: 40px 0 28px;
    }

    .hero {
      padding: 28px;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: rgba(255, 253, 249, 0.88);
      backdrop-filter: blur(8px);
      box-shadow: var(--shadow);
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(2rem, 4vw, 3.6rem);
      line-height: 0.95;
      letter-spacing: -0.04em;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.6;
      max-width: 62ch;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 22px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 18px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 700;
      transition: transform 140ms ease, background-color 140ms ease;
    }

    .button:hover {
      transform: translateY(-1px);
    }

    .button.primary {
      background: var(--accent);
      color: #fff;
    }

    .button.primary:hover {
      background: var(--accent-strong);
    }

    .button.secondary {
      border: 1px solid var(--border);
      color: var(--text);
      background: transparent;
    }

    .viewer {
      margin-top: 24px;
      border: 1px solid var(--border);
      border-radius: 24px;
      overflow: hidden;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    iframe {
      display: block;
      width: 100%;
      height: min(80vh, 1100px);
      border: 0;
      background: #fff;
    }

    footer {
      padding: 18px 4px 0;
      font-size: 0.95rem;
      color: var(--muted);
    }

    @media (max-width: 720px) {
      main {
        width: min(100% - 20px, 1100px);
        padding-top: 20px;
      }

      .hero {
        padding: 22px 18px;
        border-radius: 20px;
      }

      iframe {
        height: 72vh;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="hero">
      <h1>Radu Echim</h1>
      <p>
        Curriculum vitae hosted through GitHub Pages. Use the embedded viewer below,
        open the PDF directly, or download a local copy.
      </p>
      <div class="actions">
        <a class="button primary" href="./Radu_Echim_CV-1.pdf" target="_blank" rel="noopener noreferrer">Open PDF</a>
        <a class="button secondary" href="./Radu_Echim_CV-1.pdf" download>Download PDF</a>
      </div>
    </section>

    <section class="viewer" aria-label="Embedded PDF viewer">
      <iframe src="./Radu_Echim_CV-1.pdf" title="Radu Echim CV PDF"></iframe>
    </section>

    <footer>
      If the PDF preview does not load in your browser, use "Open PDF" above.
    </footer>
  </main>
</body>
</html>
